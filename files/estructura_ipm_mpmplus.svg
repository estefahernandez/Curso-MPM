  <rect x="386.67" y="0" width="386.66" height="6" fill="#0f857b"/>
  <rect x="773.33" y="0" width="386.67" height="6" fill="#c05f3f"/>
  <text x="40" y="68" class="title" font-size="34" fill="#141413">Medida de Pobreza Multidimensional Plus</text>
  <rect x="838" y="45" width="96" height="34" rx="17" fill="#c05f3f"/>
  <text x="886" y="69" text-anchor="middle" class="name" font-size="18" fill="#ffffff">MPM+</text>
  <line x1="40" y1="96" x2="1120" y2="96" stroke="#141413" stroke-width="2"/>
  <text x="40" y="122" font-size="16" fill="#4a4f57">Versión ampliada (MPM+): umbrales más exigentes · 3 dimensiones · 6 indicadores · k = 1/3</text>
  <rect x="40" y="772" width="300" height="116" rx="16" fill="#c05f3f"/>
  <circle cx="92" cy="793" r="13" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="92" y="799" text-anchor="middle" class="name" font-size="16" fill="#ffffff">$</text>
  <text x="76" y="836" class="name" font-size="24" fill="#ffffff">Monetaria</text>
  <rect x="76" y="847" width="64" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/>
  <text x="108" y="865" text-anchor="middle" class="frac" font-size="14" fill="#ffffff">1/3</text>
  <rect x="40" y="410" width="300" height="344" rx="16" fill="#0f857b"/>
  <polygon points="77,544 92,531 107,544" fill="#ffffff"/>
  <rect x="81" y="544" width="22" height="15" fill="#ffffff"/>
  <rect x="89" y="550" width="6" height="9" fill="#0f857b"/>
  <text x="76" y="588" class="name" font-size="24" fill="#ffffff">Infraestructura</text>
  <rect x="76" y="599" width="64" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/>
  <text x="108" y="617" text-anchor="middle" class="frac" font-size="14" fill="#ffffff">1/3</text>
  <rect x="40" y="150" width="300" height="242" rx="16" fill="#34689e"/>
  <polygon points="76,234 92,226 108,234 92,242" fill="#ffffff"/>
  <path d="M83,237 L83,242 Q92,247 101,242 L101,237 Z" fill="#ffffff"/>
  <line x1="108" y1="234" x2="108" y2="245" stroke="#ffffff" stroke-width="2"/>
  <circle cx="108" cy="246" r="2" fill="#ffffff"/>
  <text x="76" y="277" class="name" font-size="24" fill="#ffffff">Educación</text>
  <rect x="76" y="288" width="64" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/>
  <text x="108" y="306" text-anchor="middle" class="frac" font-size="14" fill="#ffffff">1/3</text>
  <rect x="358" y="150" width="762" height="116" rx="12" fill="#eef4fa"/>
  <rect x="358" y="160" width="6" height="96" rx="3" fill="#6a9bcc"/>
  <text x="384" y="184" class="title" font-size="22" fill="#274b73">Logro educativo</text>
  <rect x="1044" y="165" width="56" height="26" rx="13" fill="#dae8f4"/>
  <text x="1072" y="183" text-anchor="middle" class="frac" font-size="14" fill="#274b73">1/6</text>
  <text x="384" y="214" font-size="18" fill="#3d4b5a">Ningún adulto (20 años o más) del hogar ha</text>
  <text x="384" y="239" font-size="18" fill="#3d4b5a">completado la educación secundaria básica.</text>
  <rect x="358" y="276" width="762" height="116" rx="12" fill="#eef4fa"/>
  <rect x="358" y="286" width="6" height="96" rx="3" fill="#6a9bcc"/>
  <text x="384" y="310" class="title" font-size="22" fill="#274b73">Matrícula escolar</text>
  <rect x="1044" y="291" width="56" height="26" rx="13" fill="#dae8f4"/>
  <text x="1072" y="309" text-anchor="middle" class="frac" font-size="14" fill="#274b73">1/6</text>
  <text x="384" y="340" font-size="18" fill="#3d4b5a">Algún niño de 7 a 14 años no está matriculado,</text>
  <text x="384" y="365" font-size="18" fill="#3d4b5a">o tiene un rezago escolar de más de un año.</text>
  <rect x="358" y="410" width="762" height="116" rx="12" fill="#e6f6f4"/>
  <rect x="358" y="420" width="6" height="96" rx="3" fill="#12b3a8"/>
  <text x="384" y="444" class="title" font-size="22" fill="#0b5d55">Electricidad</text>
  <rect x="1044" y="425" width="56" height="26" rx="13" fill="#cdeee9"/>
  <text x="1072" y="443" text-anchor="middle" class="frac" font-size="14" fill="#0b5d55">1/9</text>
  <text x="384" y="474" font-size="18" fill="#33514c">El hogar no tiene electricidad, o sufrió cortes de</text>
  <text x="384" y="499" font-size="18" fill="#33514c">más de 30 minutos algún día del último mes.</text>
  <rect x="358" y="536" width="762" height="116" rx="12" fill="#e6f6f4"/>
  <rect x="358" y="546" width="6" height="96" rx="3" fill="#12b3a8"/>
  <text x="384" y="570" class="title" font-size="22" fill="#0b5d55">Agua potable</text>
  <rect x="1044" y="551" width="56" height="26" rx="13" fill="#cdeee9"/>
  <text x="1072" y="569" text-anchor="middle" class="frac" font-size="14" fill="#0b5d55">1/9</text>
  <text x="384" y="600" font-size="18" fill="#33514c">El hogar no tiene acceso a agua potable de estándar</text>
  <text x="384" y="625" font-size="18" fill="#33514c">limitado; los pozos públicos no cumplen ese estándar.</text>
  <rect x="358" y="662" width="762" height="92" rx="12" fill="#e6f6f4"/>
  <rect x="358" y="672" width="6" height="72" rx="3" fill="#12b3a8"/>
  <text x="384" y="696" class="title" font-size="22" fill="#0b5d55">Saneamiento</text>
  <rect x="1044" y="677" width="56" height="26" rx="13" fill="#cdeee9"/>
  <text x="1072" y="695" text-anchor="middle" class="frac" font-size="14" fill="#0b5d55">1/9</text>
  <text x="384" y="732" font-size="18" fill="#33514c">El hogar no tiene acceso a saneamiento de estándar limitado.</text>
  <rect x="358" y="772" width="762" height="116" rx="12" fill="#fbeee7"/>
  <rect x="358" y="782" width="6" height="96" rx="3" fill="#d97757"/>
  <text x="384" y="806" class="title" font-size="22" fill="#8f4327">Pobreza monetaria</text>
  <rect x="1044" y="787" width="56" height="26" rx="13" fill="#f6ddd0"/>
  <text x="1072" y="805" text-anchor="middle" class="frac" font-size="14" fill="#8f4327">1/3</text>
  <text x="384" y="836" font-size="18" fill="#5c463d">Consumo diario per cápita inferior a 8,30 USD</text>
  <text x="384" y="861" font-size="18" fill="#5c463d">(PPA 2021) · línea de países de ingreso medio-alto.</text>
  <text x="40" y="922" font-size="12.5" fill="#6a6f77">Fuente: Banco Mundial, Evaluación de Pobreza y Equidad (PEA) de Guinea Ecuatorial, con base en la ENH2 (2022–23).</text>
</svg>