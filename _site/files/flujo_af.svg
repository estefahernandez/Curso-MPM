<svg viewBox="0 0 1230 580" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .t { font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#55606b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1230" height="580" fill="#ffffff"/>

  <!-- Barra superior (misma familia visual) -->
  <rect x="0" y="0" width="410" height="6" fill="#34689e"/>
  <rect x="410" y="0" width="410" height="6" fill="#0f857b"/>
  <rect x="820" y="0" width="410" height="6" fill="#c05f3f"/>

  <!-- Encabezado -->
  <text x="40" y="52" class="t" font-size="28" fill="#141413">El método Alkire-Foster, paso a paso</text>
  <text x="40" y="80" font-size="15" fill="#4a4f57">De la matriz de privaciones al índice: doble corte (dentro de cada indicador y entre indicadores, k = 1/3).</text>
  <line x1="40" y1="100" x2="1190" y2="100" stroke="#141413" stroke-width="2"/>

  <!-- ===== Flechas ===== -->
  <path d="M232,280 L276,280" stroke="#55606b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M472,280 L539,280" stroke="#55606b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M691,280 L756,280" stroke="#55606b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M952,280 L996,280" stroke="#55606b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M615,356 L615,445 L756,445" stroke="#55606b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- etiqueta Sí -->
  <rect x="703" y="257" width="40" height="22" rx="11" fill="#d5f2ee"/>
  <text x="723" y="272" text-anchor="middle" class="t" font-size="13" fill="#0b5d55">Sí</text>
  <!-- etiqueta No -->
  <rect x="624" y="389" width="42" height="22" rx="11" fill="#e3e6ea"/>
  <text x="645" y="404" text-anchor="middle" class="t" font-size="13" fill="#55606b">No</text>

  <!-- ===== 1. Matriz ===== -->
  <rect x="40" y="230" width="190" height="100" rx="14" fill="#34689e"/>
  <circle cx="62" cy="230" r="14" fill="#274b73"/>
  <text x="62" y="235" text-anchor="middle" class="t" font-size="15" fill="#ffffff">1</text>
  <text x="135" y="272" text-anchor="middle" class="t" font-size="17" fill="#ffffff">Matriz de privaciones</text>
  <text x="135" y="304" text-anchor="middle" font-size="17" fill="#ffffff">g<tspan dy="5" font-size="12">ij</tspan><tspan dy="-5"> ∈ {0, 1}</tspan></text>
  <text x="135" y="352" text-anchor="middle" font-size="13.5" fill="#6a7078">1 si el hogar está privado en el</text>
  <text x="135" y="371" text-anchor="middle" font-size="13.5" fill="#6a7078">indicador; 0 en caso contrario.</text>

  <!-- ===== 2. Puntaje ===== -->
  <rect x="280" y="230" width="190" height="100" rx="14" fill="#34689e"/>
  <circle cx="302" cy="230" r="14" fill="#274b73"/>
  <text x="302" y="235" text-anchor="middle" class="t" font-size="15" fill="#ffffff">2</text>
  <text x="375" y="272" text-anchor="middle" class="t" font-size="17" fill="#ffffff">Puntaje ponderado</text>
  <text x="375" y="304" text-anchor="middle" font-size="17" fill="#ffffff">c<tspan dy="5" font-size="12">i</tspan><tspan dy="-5"> = Σ w</tspan><tspan dy="5" font-size="12">j</tspan><tspan dy="-5"> g</tspan><tspan dy="5" font-size="12">ij</tspan><tspan dy="-5"></tspan></text>
  <text x="375" y="352" text-anchor="middle" font-size="13.5" fill="#6a7078">Privaciones del hogar sumadas y</text>
  <text x="375" y="371" text-anchor="middle" font-size="13.5" fill="#6a7078">ponderadas por el peso de cada una.</text>

  <!-- ===== 3. Decisión (diamante) ===== -->
  <polygon points="615,206 689,280 615,354 541,280" fill="#c05f3f"/>
  <circle cx="615" cy="206" r="14" fill="#8f4327"/>
  <text x="615" y="211" text-anchor="middle" class="t" font-size="15" fill="#ffffff">3</text>
  <text x="615" y="276" text-anchor="middle" class="t" font-size="18" fill="#ffffff">¿c<tspan dy="5" font-size="12">i</tspan><tspan dy="-5"> ≥ k?</tspan></text>
  <text x="615" y="300" text-anchor="middle" font-size="13" fill="#ffffff">k = 1/3</text>

  <!-- ===== Pobre (Sí) ===== -->
  <rect x="760" y="230" width="190" height="100" rx="14" fill="#14b8a6"/>
  <text x="855" y="272" text-anchor="middle" class="t" font-size="17" fill="#08403b">Pobre</text>
  <text x="855" y="298" text-anchor="middle" class="t" font-size="17" fill="#08403b">multidimensional</text>
  <text x="855" y="352" text-anchor="middle" font-size="13.5" fill="#6a7078">Se cuenta como pobre; se</text>
  <text x="855" y="371" text-anchor="middle" font-size="13.5" fill="#6a7078">conservan sus privaciones.</text>

  <!-- ===== 4. Resultados ===== -->
  <rect x="1000" y="230" width="190" height="100" rx="14" fill="#14b8a6"/>
  <circle cx="1022" cy="230" r="14" fill="#0b5d55"/>
  <text x="1022" y="235" text-anchor="middle" class="t" font-size="15" fill="#ffffff">4</text>
  <text x="1095" y="272" text-anchor="middle" class="t" font-size="18" fill="#08403b">H, A y M<tspan dy="5" font-size="12">0</tspan><tspan dy="-5"></tspan></text>
  <text x="1095" y="300" text-anchor="middle" font-size="14" fill="#08403b">+ descomposiciones</text>
  <text x="1095" y="352" text-anchor="middle" font-size="13.5" fill="#6a7078">Incidencia, intensidad e IPM,</text>
  <text x="1095" y="371" text-anchor="middle" font-size="13.5" fill="#6a7078">por indicador y por grupo.</text>

  <!-- ===== No pobre ===== -->
  <rect x="760" y="401" width="190" height="88" rx="14" fill="#141413"/>
  <text x="855" y="451" text-anchor="middle" class="t" font-size="18" fill="#ffffff">No pobre</text>
  <text x="855" y="511" text-anchor="middle" font-size="13.5" fill="#6a7078">Sus privaciones se descartan</text>
  <text x="855" y="530" text-anchor="middle" font-size="13.5" fill="#6a7078">del cálculo (censura).</text>
</svg>
